<style>
@property --p{syntax:'<number>';inherits:false;initial-value:0}
:root{--bg:#FDF9F0;--sf:#fff;--tx:#1F2937;--mu:#6B7280;--bd:#E9E2D0;--pr:#8B5CF6;--pt:#6D3FD6;--p2:#C4B5FD;--pb:#F1ECFE;--gr:#2F855A;--g2:#68D391;--gb:#E3F6EA;--er:#D9363E;--eb:#FDE4E4;--wa:#D97706;--wb:#FFF1D6;--nv:#1F2937;--fh:Montserrat,system-ui,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-t=dark]{--bg:#111827;--sf:#1F2937;--tx:#F9FAFB;--mu:#9CA3AF;--bd:#374151;--pt:#C4B5FD;--pb:#2B2350;--gr:#68D391;--gb:#17382A;--er:#FF7B7B;--eb:#4A1D22;--wa:#FBBF24;--wb:#4A3310;--nv:#0B1220;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif;transition:background .4s,color .4s}
h2,h3{font-family:var(--fh);margin:0}h2{font-size:22px}h3{font-size:16px;margin:22px 0 10px}p.s{color:var(--mu);margin:2px 0 16px}
header{background:var(--sf);border-bottom:1px solid var(--bd);padding:12px 16px 0;position:sticky;top:0;z-index:5;transition:background .4s}
.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px;height:44px}.brand b{font:800 22px var(--fh);letter-spacing:.01em;line-height:1.1;display:block}.brand small{display:block;color:var(--mu);font-size:12px}
#th{border:1px solid var(--bd);background:var(--pb);color:var(--pt);border-radius:99px;padding:6px 14px;font:600 13px var(--fh);cursor:pointer;transition:transform .2s}#th:hover{transform:scale(1.06)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0}nav button{background:none;border:0;border-radius:99px;padding:8px 14px;color:var(--mu);font:600 14px Inter;cursor:pointer;white-space:nowrap;transition:all .2s}
nav button:hover{background:var(--pb);color:var(--pt)}nav button.on{background:var(--pr);color:#fff;box-shadow:0 4px 14px #8b5cf655}
main{max-width:1100px;margin:0 auto;padding:20px 16px 70px;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}}@keyframes pu{0%,100%{box-shadow:0 0 0 0 var(--c)}50%{box-shadow:0 0 0 8px transparent}}@keyframes sh{0%,100%{transform:none}20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;transition:transform .2s,box-shadow .2s}.c:hover{transform:translateY(-2px);box-shadow:0 8px 20px #0001}
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;border-radius:20px;padding:22px;color:#fff;background:linear-gradient(120deg,#8B5CF6,#2F855A);margin-bottom:14px}
.hero h2{font-size:24px}.hero p{margin:4px 0 0;opacity:.92}
.don{width:96px;height:96px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative;background:conic-gradient(#fff calc(var(--p)*1%),#ffffff44 0);transition:--p 1.2s ease}
.don:before{content:"";position:absolute;inset:11px;border-radius:50%;background:#2c3a63}.don span{position:relative;font:800 20px var(--fh)}
.kp{border-radius:16px;padding:16px;color:#fff;transition:transform .2s}.kp:hover{transform:translateY(-3px) scale(1.02)}.kp b{display:block;font:800 32px var(--fh)}.kp small{opacity:.92}
.k1{background:linear-gradient(135deg,#8B5CF6,#6D3FD6)}.k2{background:linear-gradient(135deg,#2F855A,#68D391)}.k3{background:linear-gradient(135deg,#F59E0B,#D97706)}.k4{background:linear-gradient(135deg,#EF4444,#B91C1C)}.k5{background:linear-gradient(135deg,#374151,#1F2937)}
.al{--c:#ef444488;display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;margin-bottom:8px;font-weight:600;border-left:6px solid;animation:pu 1.8s infinite}
.al.er{background:var(--eb);color:var(--er);border-color:var(--er)}.al.wa{--c:#f59e0b88;background:var(--wb);color:var(--wa);border-color:var(--wa)}.al.er i{animation:sh .8s infinite 2s}
.al i{font-style:normal;font-size:20px}.ok0{background:var(--gb);color:var(--gr);padding:12px;border-radius:12px;font-weight:600}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}.ok{background:var(--gb);color:var(--gr)}.wa{background:var(--wb);color:var(--wa)}.er{background:var(--eb);color:var(--er);animation:pu 1.8s infinite;--c:#ef444477}.pr{background:var(--pb);color:var(--pt)}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--pr),var(--g2));transition:width 1s cubic-bezier(.2,.8,.2,1)}
.seg{display:grid;gap:3px;margin:6px 0}.seg i{height:7px;border-radius:4px;background:var(--bd);overflow:hidden}.seg b{display:block;height:100%;width:0;transition:width 1s}
.seg i:nth-child(1) b{background:#8B5CF6}.seg i:nth-child(2) b{background:#A78BFA}.seg i:nth-child(3) b{background:#2F855A}.seg i:nth-child(4) b{background:#68D391}.seg i:nth-child(5) b{background:#6B7280}
.cols{display:flex;gap:8px;align-items:flex-end;height:130px}.cols div{flex:1;text-align:center;font-size:11px;color:var(--mu);height:100%;display:flex;flex-direction:column;justify-content:flex-end}.cols i{display:block;border-radius:6px 6px 0 0;background:linear-gradient(var(--pr),var(--p2));height:0;transition:height 1s;min-height:3px}
.kb{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px}.col{flex:0 0 225px;background:var(--pb);border-radius:14px;padding:10px}
.col h4{margin:0 0 8px;font:700 13px var(--fh);display:flex;justify-content:space-between;color:var(--pt)}.col .c{margin-bottom:8px;padding:10px;font-size:13px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:9px;padding:7px 12px;font:600 12px Inter;cursor:pointer;margin:6px 4px 0 0;transition:transform .15s,box-shadow .15s}.btn:hover{transform:translateY(-2px);box-shadow:0 5px 12px #8b5cf644}
.btn.o{background:none;color:var(--pt);border:1px solid var(--p2)}.btn.w{background:var(--er);color:#fff}.btn.g{background:var(--gr);color:#fff}[data-t=dark] .btn.g{color:#111827}.btn:disabled{opacity:.35;cursor:default;transform:none;box-shadow:none}
table{width:100%;border-collapse:collapse;background:var(--sf);border-radius:14px;overflow:hidden}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:top}th{color:var(--mu);font-size:13px;background:var(--pb)}tr{transition:background .2s}tbody tr:hover,tr:hover td{background:var(--pb)}
.w{overflow-x:auto;border:1px solid var(--bd);border-radius:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}.mt{font-size:13px;color:var(--mu)}
.sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.sl label{display:flex;justify-content:space-between;font-weight:600}.sl input{width:100%;accent-color:var(--pr)}
.sup{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.sup .sc{font:800 32px var(--fh);color:var(--pt)}
.chat{max-width:640px}.msgs{min-height:200px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}.m{padding:9px 12px;border-radius:14px;max-width:85%;white-space:pre-line;animation:in .3s}.m.u{align-self:flex-end;background:var(--pr);color:#fff}.m.b{background:var(--pb)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chips button{border:1px solid var(--p2);background:var(--sf);color:var(--pt);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
input,select{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:9px;padding:8px;font:inherit;width:100%}.chat form{display:flex;gap:8px}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}.fm label{font-size:13px;color:var(--mu)}.fm .f{grid-column:1/-1}
#md{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}#md.on{display:flex}#md>div{background:var(--sf);border-radius:16px;padding:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto;animation:in .25s}
#t{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--pr);color:#fff;font-weight:600;padding:10px 18px;border-radius:99px;opacity:0;transition:all .3s;pointer-events:none;z-index:30}#t.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sb{position:relative;margin:0 0 14px;max-width:420px}.sb span{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none}.sb input{padding-left:40px;border-radius:99px}.nr{display:none;text-align:center;color:var(--mu);padding:14px}
#lg{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}#lg form{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:24px;max-width:380px;width:100%;animation:in .4s}#lg img{width:64px;height:64px}#lg label{font-size:13px;color:var(--mu)}#lg input{margin:4px 0 12px}.top>div:last-child{display:flex;gap:6px;align-items:center}
